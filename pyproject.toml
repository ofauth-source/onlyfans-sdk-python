[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onlyfans-sdk"
version = "4.0.0rc1"
description = "OFAuth V3 Python SDK: OAuth (Link), namespaced Access and Vault+ clients (sync and async), webhooks, Realtime, and uploads"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["ofauth", "onlyfans", "onlyfans-api", "oauth", "sdk", "webhooks"]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://docs.ofauth.com"
Repository = "https://github.com/OFAuth-org/onlyfans-sdk-python"

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
flask = ["flask>=2.2"]
docs = ["pdoc>=14"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["onlyfans_sdk"]

# models.py is generated by datamodel-codegen; its enum defaults trip mypy.
[[tool.mypy.overrides]]
module = "onlyfans_sdk.models"
ignore_errors = true
